server:
  port: 8085
  servlet:
    context-path: /ddd

spring:
  application:
    name: demo-ddd
  
  # H2数据库配置
  datasource:
    url: jdbc:h2:mem:ddddb
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  
  # MyBatis配置
  mybatis:
    mapper-locations: classpath:mapper/**/*.xml
    type-aliases-package: com.qiubithub.ddd.domain.model
    configuration:
      map-underscore-to-camel-case: true
      log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
      
  # PageHelper配置
  pagehelper:
    helper-dialect: h2
    reasonable: true
    support-methods-arguments: true
  
  # H2控制台配置
  h2:
    console:
      enabled: true
      path: /h2-console

# 日志配置
logging:
  level:
    com.qiubithub.ddd: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE